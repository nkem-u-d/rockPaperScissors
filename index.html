<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors game</title>
</head>
<script>
    // logic to get computer choice
    function getComputerChoice(){
        const options= ["rock", "paper", "scissors"];
        let computerChoice = options[Math.floor(Math.random() * options.length)];
        return computerChoice;
    }
    // logic to get human choice
    function getHumanChoice(){
        let humanChoice = prompt("Rock, Paper or Scissors, pick your poison");
        return humanChoice.toLowerCase();
    }
    // creating the game function that lets us play the game multiple times 
    
    function playGame(){
        let humanScore = 0;
        let computerScore = 0;

        // function to take the users choice.
        function playRound(humanChoice, computerChoice){
        if ( humanChoice === computerChoice){
            console.log("its a tie!");
        }
        else if (
            (humanChoice === "rock" && computerChoice === "scissors") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissors" && computerChoice === "paper")
        ){
            humanScore++;
            console.log(`Genius!, you won because ${humanChoice} beats ${computerChoice}` );
        }
        else{
            computerScore++;
            console.log(`Dumb-ass, you lost because ${ computerChoice} beats ${humanChoice}`);
        }
         console.log(`Score: \n  Human: ${humanScore} | Computer: ${computerScore}`);
    
    }
    // to play 5 rounds 
    for (let i = 0; i <= 5; i++){
        console.log(`Round ${i}`);
        const human = getHumanChoice() //stores the user choice to be used later on
        const computer = getComputerChoice()    // stores computer choice, can be referenced later on
        playRound(human, computer);
    }
    if (humanScore > computerScore){
        console.log("you won the game, at least you're not a complete failure, yet.".toLowerCase());
    }
    else if(computerScore > humanScore){
        console.log("you lost the game,how does it feel losing to a computer, you retard".toUpperCase());
    } 
    else{
        console.log("the game was a tie".toUpperCase());
    }

    }
    playGame() 
</script>

</body>
</html>
