<script>
    //function that gets a random word by the computer from the declared array    
    function getComputerChoice(){
        const computerValue = ["rock", "paper", "scissors"];
        return computerValue[Math.floor(Math.random() * computerValue.length)];
    }

    // implementing the function that gets human choice/input

    function getHumanChoice(){
        const humanChoice = prompt("enter a value");
        return humanChoice.toLowerCase();
    }

    // added variable to store human and computer choice respectively

    const human = getHumanChoice();
    const computer = getComputerChoice();

    console.log("human: ", human);
    console.log("computer: ", computer);

    // logic on the output options depending on the user choice
    if(human === computer){
        console.log("your are correct");
    }
    else if (human === ""){
        console.log("enter a value you fool!!");
    }
    else {
        console.log("Are you dumb?");
    }
    


</script>
