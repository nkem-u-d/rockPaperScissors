<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // logic to get computer choice
    function getComputerChoice(){
        const options= ["rock", "paper", "scissors"];
        let computerChoice = options[Math.floor(Math.random() * options.length)];
        return computerChoice;
    }
    // logic to get human choice
    function getHumanChoice(){
        let humanChoice = prompt('rock, paper or Scissors:');
        return humanChoice.toLowerCase();

    }
    

    // comparing human choice and computer choice and outputting the results]
    


    function playGame(){
        let humanScore = 0;
        let computerScore = 0;

        function playRound(humanChoice, computerChoice){
        if ( humanChoice === computerChoice){
            console.log("its a tie!");
        }
        else if (
            (humanChoice === "rock" && computerChoice === "scissors") ||
            (humanChoice === "paper" && computerChoice === "rock") ||
            (humanChoice === "scissors" && computerChoice === "paper")
        ){
            humanScore++;
            console.log(`you won because ${humanChoice} beats ${computerChoice}` );
        }
        else{
            computerScore++;
            console.log(`you lost: ${ computerChoice} beats ${humanChoice}`);
        }
         console.log(`Score: \n  Human: ${humanScore} | Computer: ${computerScore}`);
    
    }
    // to play 5 rounds 
    for (let i = 0; i <= 5; i++){
        console.log(`Round ${i}`);
        const human = getHumanChoice() 
        const computer = getComputerChoice()
        playRound(human, computer);
    }
    if (humanScore > computerScore){
        console.log("you won the game, you're the champion");
    }
    else if(computerScore > humanScore){
        console.log("you lost the game, try again");
    } 
    else{
        console.log("the game was a tie");
    }

    }
    playGame()

    

    
    


</script>
